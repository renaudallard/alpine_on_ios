name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build emulator
        run: make -C emu

      - name: Run tests
        run: make -C emu test

  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build AOT tools outside xcodebuild
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          /tmp/aot-tools/elf2macho 2>&1 | head -1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
            chmod +x rootfs/alpine/root/.xinitrc rootfs/alpine/root/start-firefox.sh 2>/dev/null || true
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          BUILD_DIR=$(xcodebuild -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO \
            | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')
          mkdir -p Payload
          ditto "$BUILD_DIR/AlpineOnIOS.app" Payload/AlpineOnIOS.app
          zip -ry AlpineOnIOS.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: AlpineOnIOS-ci
          path: AlpineOnIOS.ipa

  test-simulator:
    name: Simulator smoke test
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build AOT tools
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for rt, dl in devs.items():
              if 'iOS' in rt:
                  for d in dl:
                      if d['isAvailable']:
                          print(d['udid']); sys.exit(0)
          sys.exit(1)")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Picked simulator $DEVICE"

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Smoke test in Simulator
        run: |
          set -e
          DEVICE="${{ steps.sim.outputs.device }}"
          echo "Using simulator $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          # Install
          APP=$(find DerivedData -name "AlpineOnIOS.app" \
            -path "*iphonesimulator*" | head -1)
          [ -z "$APP" ] && { echo "FAIL: .app not found"; exit 1; }
          echo "Installing $APP"
          xcrun simctl install "$DEVICE" "$APP"

          # Launch and capture PID
          OUTPUT=$(xcrun simctl launch "$DEVICE" com.alpineonios.app)
          PID=$(echo "$OUTPUT" | grep -oE '[0-9]+$')
          echo "Launched PID=$PID, waiting 20s for startup..."
          sleep 20

          # Check if process is still alive
          if kill -0 "$PID" 2>/dev/null; then
            echo "PASS: app still running after 20s"
            xcrun simctl terminate "$DEVICE" com.alpineonios.app \
              2>/dev/null || true
          else
            echo "FAIL: app crashed during startup"
            # Dump any crash log
            find ~/Library/Logs/DiagnosticReports \
              -name "AlpineOnIOS*" -newer "$APP" 2>/dev/null \
              | head -3 | xargs head -80 2>/dev/null || true
            exit 1
          fi

          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
