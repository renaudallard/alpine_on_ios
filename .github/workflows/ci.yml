name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build emulator
        run: make -C emu

      - name: Run tests
        run: make -C emu test

  build-ios:
    name: Build iOS
    runs-on: macos-15
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Diagnose binary execution
        run: |
          cat > /tmp/hello.c <<'EOF'
          #include <stdio.h>
          int main(int argc, char **argv) { (void)argv; printf("hello %d\n", argc); return 0; }
          EOF
          cc -O2 -o /tmp/hello /tmp/hello.c
          file /tmp/hello
          codesign -dvvv /tmp/hello 2>&1 || true
          /tmp/hello arg1 arg2
          echo "plain hello worked, exit=$?"
          codesign --force --sign - /tmp/hello 2>&1 || true
          /tmp/hello arg1
          echo "signed hello exit=$?"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
            chmod +x rootfs/alpine/root/.xinitrc rootfs/alpine/root/start-firefox.sh 2>/dev/null || true
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          BUILD_DIR=$(xcodebuild -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO \
            | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')
          mkdir -p Payload
          ditto "$BUILD_DIR/AlpineOnIOS.app" Payload/AlpineOnIOS.app
          zip -ry AlpineOnIOS.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: AlpineOnIOS-ci
          path: AlpineOnIOS.ipa
