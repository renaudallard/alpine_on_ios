name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build emulator
        run: make -C emu

      - name: Run tests
        run: make -C emu test

  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build AOT tools outside xcodebuild
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          /tmp/aot-tools/elf2macho 2>&1 | head -1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
            chmod +x rootfs/alpine/root/.xinitrc rootfs/alpine/root/start-firefox.sh 2>/dev/null || true
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          BUILD_DIR=$(xcodebuild -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO \
            | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')
          mkdir -p Payload
          ditto "$BUILD_DIR/AlpineOnIOS.app" Payload/AlpineOnIOS.app
          zip -ry AlpineOnIOS.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: AlpineOnIOS-ci
          path: AlpineOnIOS.ipa

  test-simulator:
    name: Simulator smoke test
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build AOT tools
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for rt, dl in devs.items():
              if 'iOS' in rt:
                  for d in dl:
                      if d['isAvailable']:
                          print(d['udid']); sys.exit(0)
          sys.exit(1)")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Picked simulator $DEVICE"

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            ONLY_ACTIVE_ARCH=YES

      - name: Smoke test (launch check)
        timeout-minutes: 3
        run: |
          set -e
          DEVICE="${{ steps.sim.outputs.device }}"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true

          APP=$(find DerivedData -name "AlpineOnIOS.app" \
            -path "*iphonesimulator*" | head -1)
          [ -z "$APP" ] && { echo "FAIL: .app not found"; exit 1; }
          xcrun simctl install "$DEVICE" "$APP"

          # Launch and check the app doesn't crash on startup.
          # dlopen of AOT dylibs fails on the simulator (library
          # validation), so the app will land in .error state
          # but must not segfault or abort.
          OUTPUT=$(xcrun simctl launch "$DEVICE" com.alpineonios.app)
          PID=$(echo "$OUTPUT" | grep -oE '[0-9]+$')
          echo "Launched PID=$PID"
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "PASS: app alive after 10s"
            xcrun simctl terminate "$DEVICE" com.alpineonios.app \
              2>/dev/null || true
          else
            echo "FAIL: app crashed"
            find ~/Library/Logs/DiagnosticReports \
              -name "AlpineOnIOS*" -newer "$APP" 2>/dev/null \
              | head -3 | xargs head -80 2>/dev/null || true
            xcrun simctl shutdown "$DEVICE" 2>/dev/null || true
            exit 1
          fi
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true

  test-native:
    name: Native integration test
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build AOT tools
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
          fi

      - name: Patch rootfs (macOS native)
        run: |
          export PLATFORM_NAME=macosx
          scripts/patch_rootfs_aot.sh rootfs/alpine rootfs/alpine

      - name: Build emulator (macOS)
        run: make -C emu

      - name: Create busybox symlinks
        run: |
          OVERLAY="$RUNNER_TEMP/alpine_overlay"
          mkdir -p "$OVERLAY/bin" "$OVERLAY/sbin" \
            "$OVERLAY/usr/bin" "$OVERLAY/usr/sbin"
          for cmd in sh ls cat echo grep sed head tail \
            sort wc cut tr find xargs mkdir rm cp mv; do
            ln -sf /bin/busybox "$OVERLAY/bin/$cmd"
          done
          echo "ALPINE_OVERLAY=$OVERLAY" >> "$GITHUB_ENV"

      - name: Run integration test
        timeout-minutes: 10
        run: |
          set -e
          ROOTFS="$(pwd)/rootfs/alpine"
          OVERLAY="$ALPINE_OVERLAY"

          # Build a small C test harness that exercises the
          # emulator: init, spawn, write echo/ls, read output.
          cat > /tmp/integration_test.c << 'TESTEOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <poll.h>
          #include "emu.h"

          static char buf[65536];
          static int pass, fail;

          static char *drain(int fd, int timeout_ms) {
              int off = 0;
              struct pollfd pfd = { .fd = fd, .events = POLLIN };
              while (off < (int)sizeof(buf) - 1 &&
                     poll(&pfd, 1, timeout_ms) > 0) {
                  int n = (int)read(fd, buf + off,
                      sizeof(buf) - 1 - off);
                  if (n <= 0) break;
                  off += n;
                  timeout_ms = 200;
              }
              buf[off] = '\0';
              return buf;
          }

          static char *run(int fd, const char *cmd, int wait_s) {
              char w[1024];
              snprintf(w, sizeof(w), "%s; echo __MARK__\n", cmd);
              write(fd, w, strlen(w));
              sleep(wait_s);
              return drain(fd, 3000);
          }

          static void chk(const char *name, const char *out,
              const char *expect) {
              if (expect == NULL || strstr(out, expect)) {
                  printf("  PASS: %s\n", name); pass++;
              } else {
                  printf("  FAIL: %s (want '%s')\n",
                      name, expect);
                  printf("    got: %.200s\n", out); fail++;
              }
          }

          int main(int argc, char **argv) {
              const char *rootfs = argv[1];
              const char *overlay = argv[2];
              int fd = -1;
              char *out;

              setbuf(stdout, NULL);
              setbuf(stderr, NULL);

              if (emu_init(rootfs) != 0) {
                  fprintf(stderr, "FAIL: emu_init: %s\n",
                      emu_last_error());
                  return 1;
              }
              emu_set_overlay(overlay);

              /* Write breadcrumbs to a temp file so we can
               * dump the syscall trace on failure. */
              emu_set_breadcrumb_path("/tmp/emu_crumbs.log");

              const char *av[] = { "sh", NULL };
              const char *ev[] = {
                  "PATH=/bin:/usr/bin:/sbin:/usr/sbin",
                  "HOME=/root", "TERM=dumb",
                  "SHELL=/bin/sh", NULL
              };
              int pid = emu_spawn("/bin/busybox", av, ev, &fd);
              if (pid < 0) {
                  fprintf(stderr, "FAIL: emu_spawn: %s\n",
                      emu_last_error());
                  return 1;
              }
              printf("spawned pid=%d fd=%d\n", pid, fd);
              sleep(3);
              drain(fd, 2000);

              printf("\n=== Builtins ===\n");
              out = run(fd, "echo hello", 2);
              chk("echo", out, "hello");
              out = run(fd, "pwd", 2);
              chk("pwd", out, "/");
              out = run(fd, "true; echo $?", 2);
              chk("true", out, "0");
              out = run(fd, "false; echo $?", 2);
              chk("false", out, "1");
              out = run(fd, "test 1 -eq 1; echo $?", 2);
              chk("test", out, "0");

              printf("\n=== Fork+exec ===\n");
              out = run(fd, "/bin/echo FORKTEST", 15);
              chk("fork+exec echo", out, "FORKTEST");

              /* uname hung previously; test with 20s wait and
               * dump breadcrumbs on failure to see which
               * syscall the child is stuck on. */
              out = run(fd, "/bin/uname", 20);
              printf("uname output: '%.200s'\n", out);
              if (strstr(out, "Linux") == NULL) {
                  printf("  FAIL: uname (dumping crumbs)\n");
                  fail++;
                  FILE *cf = fopen("/tmp/emu_crumbs.log", "r");
                  if (cf) {
                      /* Print last 80 lines */
                      char lb[512]; int lc = 0;
                      char *lines[80];
                      memset(lines, 0, sizeof(lines));
                      while (fgets(lb, sizeof(lb), cf)) {
                          free(lines[lc % 80]);
                          lines[lc % 80] = strdup(lb);
                          lc++;
                      }
                      fclose(cf);
                      printf("--- last %d crumbs ---\n",
                          lc < 80 ? lc : 80);
                      for (int k = 0; k < 80 && k < lc; k++) {
                          int idx = (lc < 80)
                              ? k : (lc - 80 + k) % 80;
                          if (lines[idx])
                              printf("  %s", lines[idx]);
                      }
                      for (int k = 0; k < 80; k++)
                          free(lines[k]);
                  }
              } else {
                  printf("  PASS: uname\n"); pass++;
              }

              /* Remaining tests disabled until fork+exec is
               * confirmed working. */
              #if 0
              printf("\n=== File ops ===\n");
              out = run(fd, "mkdir -p /tmp/td", 3);
              chk("mkdir", out, "__MARK__");
              run(fd, "echo filetest > /tmp/tf", 3);
              out = run(fd, "cat /tmp/tf", 3);
              chk("cat", out, "filetest");
              out = run(fd, "cp /tmp/tf /tmp/tc", 3);
              out = run(fd, "cat /tmp/tc", 3);
              chk("cp+cat", out, "filetest");
              out = run(fd, "mv /tmp/tc /tmp/tm", 3);
              out = run(fd, "cat /tmp/tm", 3);
              chk("mv+cat", out, "filetest");
              run(fd, "rm /tmp/tm", 3);
              out = run(fd,
                  "test -f /tmp/tm; echo $?", 3);
              chk("rm", out, "1");
              out = run(fd, "touch /tmp/tt && echo ok", 3);
              chk("touch", out, "ok");
              run(fd, "ln -s /tmp/tf /tmp/tl", 3);
              out = run(fd, "cat /tmp/tl", 3);
              chk("ln -s", out, "filetest");
              out = run(fd, "rmdir /tmp/td && echo ok", 3);
              chk("rmdir", out, "ok");

              printf("\n=== Pipes + text ===\n");
              out = run(fd,
                  "echo 'hello world' | grep hello", 4);
              chk("grep", out, "hello");
              out = run(fd,
                  "echo 'hello world' | cut -d' ' -f2", 4);
              chk("cut", out, "world");
              out = run(fd,
                  "echo 'hello world' | tr a-z A-Z", 4);
              chk("tr", out, "HELLO");
              out = run(fd,
                  "echo 'hello world' | sed 's/hello/bye/'",
                  4);
              chk("sed", out, "bye");
              out = run(fd,
                  "printf 'b\\na\\nc\\n' | sort", 4);
              chk("sort", out, "a");
              out = run(fd,
                  "printf 'a\\na\\nb\\n' | uniq", 4);
              chk("uniq", out, "b");
              out = run(fd,
                  "printf 'L1\\nL2\\n' | head -1", 4);
              chk("head", out, "L1");
              out = run(fd,
                  "printf 'L1\\nL2\\n' | tail -1", 4);
              chk("tail", out, "L2");
              out = run(fd, "echo hello | base64", 4);
              chk("base64", out, "aGVsbG8K");
              out = run(fd, "echo hello | md5sum", 4);
              chk("md5sum", out, NULL);

              printf("\n=== Misc ===\n");
              out = run(fd, "printenv HOME", 3);
              chk("printenv", out, "/root");
              out = run(fd, "which sh", 3);
              chk("which", out, "/bin/sh");
              out = run(fd, "ls /tmp", 4);
              chk("ls /tmp", out, "tf");

              #endif
              printf("\n=== Summary ===\n");
              printf("%d passed, %d failed\n", pass, fail);
              if (fail > 0) {
                  printf("SOME TESTS FAILED\n");
                  return 1;
              }
              printf("ALL TESTS PASSED\n");
              return 0;
          }
          TESTEOF

          cc -O2 -I emu/include \
            -o /tmp/integration_test /tmp/integration_test.c \
            -Lemu/build -lemu -lpthread -lutil

          # Sign with disable-library-validation so dlopen of
          # our ad-hoc signed AOT dylibs is allowed on SIP-
          # enabled macOS 26 runners.
          cat > /tmp/test.entitlements << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          ENTEOF
          codesign --force --sign - \
            --entitlements /tmp/test.entitlements \
            /tmp/integration_test

          /tmp/integration_test "$ROOTFS" "$OVERLAY"
