name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build emulator
        run: make -C emu

      - name: Run tests
        run: make -C emu test

  build-ios:
    name: Build iOS
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build AOT tools outside xcodebuild
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          /tmp/aot-tools/elf2macho 2>&1 | head -1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
            chmod +x rootfs/alpine/root/.xinitrc rootfs/alpine/root/start-firefox.sh 2>/dev/null || true
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          BUILD_DIR=$(xcodebuild -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO \
            | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')
          mkdir -p Payload
          ditto "$BUILD_DIR/AlpineOnIOS.app" Payload/AlpineOnIOS.app
          zip -ry AlpineOnIOS.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: AlpineOnIOS-ci
          path: AlpineOnIOS.ipa

  test-simulator:
    name: Simulator smoke test
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build AOT tools
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          devs = json.load(sys.stdin)['devices']
          for rt, dl in devs.items():
              if 'iOS' in rt:
                  for d in dl:
                      if d['isAvailable']:
                          print(d['udid']); sys.exit(0)
          sys.exit(1)")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Picked simulator $DEVICE"

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -destination "id=${{ steps.sim.outputs.device }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            ONLY_ACTIVE_ARCH=YES

      - name: Simulator integration test
        timeout-minutes: 6
        run: |
          set -e
          DEVICE="${{ steps.sim.outputs.device }}"

          # Boot and wait for the simulator to be fully ready.
          # Plain `simctl boot` is async; `simctl launch` against a
          # half-booted device can block indefinitely.
          xcrun simctl bootstatus "$DEVICE" -b

          APP=$(find DerivedData -name "AlpineOnIOS.app" \
            -path "*iphonesimulator*" | head -1)
          [ -z "$APP" ] && { echo "FAIL: .app not found"; exit 1; }
          xcrun simctl install "$DEVICE" "$APP"

          # Drive the in-app IntegrationTest.  --console attaches
          # the app's stdout/stderr to this step so we see every
          # "INTEGRATION_TEST:" line; simctl exits when the app
          # calls exit().  The step timeout guards against hangs.
          LOG=/tmp/sim_integration.log
          set +e
          xcrun simctl launch --console \
            --terminate-running-process \
            "$DEVICE" com.alpineonios.app \
            --integration-test 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          set -e

          xcrun simctl terminate "$DEVICE" com.alpineonios.app \
            2>/dev/null || true
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true

          echo "--- simctl launch rc=$RC ---"
          if grep -q "INTEGRATION_TEST: ALL TESTS PASSED" "$LOG"; then
            echo "PASS: integration test"
            exit 0
          fi

          echo "FAIL: integration test did not report success"
          find ~/Library/Logs/DiagnosticReports \
            -name "AlpineOnIOS*" -newer "$APP" 2>/dev/null \
            | head -3 | xargs head -80 2>/dev/null || true
          exit 1

  test-native:
    name: Native integration test
    runs-on: macos-26
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build AOT tools
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
          fi

      - name: Patch rootfs (macOS native)
        run: |
          export PLATFORM_NAME=macosx
          scripts/patch_rootfs_aot.sh rootfs/alpine rootfs/alpine

      - name: Build emulator (macOS)
        run: make -C emu

      - name: Create busybox symlinks
        run: |
          OVERLAY="$RUNNER_TEMP/alpine_overlay"
          mkdir -p "$OVERLAY/bin" "$OVERLAY/sbin" \
            "$OVERLAY/usr/bin" "$OVERLAY/usr/sbin"
          for cmd in sh ls cat echo grep sed head tail \
            sort wc cut tr find xargs mkdir rm cp mv; do
            ln -sf /bin/busybox "$OVERLAY/bin/$cmd"
          done
          echo "ALPINE_OVERLAY=$OVERLAY" >> "$GITHUB_ENV"

      - name: Run integration test
        timeout-minutes: 15
        run: |
          set -e
          ROOTFS="$(pwd)/rootfs/alpine"
          OVERLAY="$ALPINE_OVERLAY"

          # Build a small C test harness that exercises the
          # emulator: init, spawn, write echo/ls, read output.
          cat > /tmp/integration_test.c << 'TESTEOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <poll.h>
          #include <sys/time.h>
          #include "emu.h"

          static char buf[65536];
          static int pass, fail;

          static long now_ms(void) {
              struct timeval tv;
              gettimeofday(&tv, NULL);
              return tv.tv_sec * 1000L + tv.tv_usec / 1000L;
          }

          static char *drain(int fd, int timeout_ms) {
              int off = 0;
              struct pollfd pfd = { .fd = fd, .events = POLLIN };
              while (off < (int)sizeof(buf) - 1 &&
                     poll(&pfd, 1, timeout_ms) > 0) {
                  int n = (int)read(fd, buf + off,
                      sizeof(buf) - 1 - off);
                  if (n <= 0) break;
                  off += n;
                  timeout_ms = 200;
              }
              buf[off] = '\0';
              return buf;
          }

          static int mark_counter;

          /* Drain stale bytes, send cmd with a unique
           * end-marker, wait for "\n__END<N>__" at the
           * start of a line.  Unique marks stop output
           * from a slow previous test leaking into the
           * current one. */
          static char *run(int fd, const char *cmd, int wait_s) {
              mark_counter++;

              struct pollfd pfd = { .fd = fd, .events = POLLIN };
              char discard[4096];
              long drain_t = now_ms() + 500;
              while (now_ms() < drain_t &&
                     poll(&pfd, 1, 50) > 0) {
                  int n = (int)read(fd, discard, sizeof(discard));
                  if (n <= 0) break;
              }

              char w[2048];
              snprintf(w, sizeof(w),
                  "%s; echo __END%d__\n", cmd, mark_counter);
              write(fd, w, strlen(w));

              char end_needle[64];
              snprintf(end_needle, sizeof(end_needle),
                  "\n__END%d__", mark_counter);

              int off = 0;
              buf[0] = '\0';
              pfd.revents = 0;
              long deadline_t =
                  now_ms() + (long)wait_s * 1000L + 3000L;
              while (off < (int)sizeof(buf) - 1 &&
                     now_ms() < deadline_t) {
                  long remain = deadline_t - now_ms();
                  int poll_ms = remain > 200 ? 200 :
                      (int)(remain > 0 ? remain : 1);
                  int r = poll(&pfd, 1, poll_ms);
                  if (r > 0) {
                      int n = (int)read(fd, buf + off,
                          sizeof(buf) - 1 - off);
                      if (n <= 0) break;
                      off += n;
                      buf[off] = '\0';
                      if (strstr(buf, end_needle)) break;
                  } else if (r < 0) {
                      break;
                  }
              }
              buf[off] = '\0';
              return buf;
          }

          static void print_escaped(const char *s) {
              for (const char *p = s; *p; p++) {
                  unsigned char c = (unsigned char)*p;
                  if (c == '\n') fputs("\\n", stdout);
                  else if (c == '\r') fputs("\\r", stdout);
                  else if (c == '\t') fputs("\\t", stdout);
                  else if (c >= 32 && c < 127) putchar(c);
                  else printf("\\x%02x", c);
              }
          }

          static void chk(const char *name, const char *out,
              const char *expect) {
              /* With our PTY's double-echo the end tag may
               * appear up to 3 times: once per echoback
               * copy, plus once in real output (at line
               * start).  Real output's mark is the one
               * preceded by \n; anything before it with
               * the end tag is echoback. */
              char end_tag[64], end_needle[64];
              snprintf(end_tag, sizeof(end_tag),
                  "__END%d__", mark_counter);
              snprintf(end_needle, sizeof(end_needle),
                  "\n__END%d__", mark_counter);

              const char *real_mark = strstr(out, end_needle);
              const char *last_echo_tag = NULL;
              const char *cursor = out;
              const char *limit = real_mark ? real_mark
                                            : out + strlen(out);
              while (cursor < limit) {
                  const char *f = strstr(cursor, end_tag);
                  if (!f || f >= limit) break;
                  last_echo_tag = f;
                  cursor = f + strlen(end_tag);
              }

              const char *real_start = out;
              if (last_echo_tag) {
                  const char *lf =
                      strchr(last_echo_tag, '\n');
                  if (lf) real_start = lf + 1;
              }
              size_t real_len = real_mark
                  ? (size_t)(real_mark - real_start)
                  : strlen(real_start);

              int found = (expect == NULL);
              if (!found && expect) {
                  size_t elen = strlen(expect);
                  if (real_len >= elen) {
                      for (size_t i = 0;
                           i + elen <= real_len; i++) {
                          if (memcmp(real_start + i,
                              expect, elen) == 0) {
                              found = 1; break;
                          }
                      }
                  }
              }

              if (found) {
                  printf("  PASS: %s\n", name); pass++;
              } else {
                  printf("  FAIL: %s (want '%s')\n",
                      name, expect);
                  printf("    got (%zu bytes): ",
                      strlen(out));
                  print_escaped(out);
                  putchar('\n');
                  fail++;
              }
          }

          int main(int argc, char **argv) {
              const char *rootfs = argv[1];
              const char *overlay = argv[2];
              int fd = -1;
              char *out;

              setbuf(stdout, NULL);
              setbuf(stderr, NULL);

              if (emu_init(rootfs) != 0) {
                  fprintf(stderr, "FAIL: emu_init: %s\n",
                      emu_last_error());
                  return 1;
              }
              emu_set_overlay(overlay);

              /* Write breadcrumbs to a temp file so we can
               * dump the syscall trace on failure. */
              emu_set_breadcrumb_path("/tmp/emu_crumbs.log");

              const char *av[] = { "sh", NULL };
              const char *ev[] = {
                  "PATH=/bin:/usr/bin:/sbin:/usr/sbin",
                  "HOME=/root", "TERM=dumb",
                  "SHELL=/bin/sh", NULL
              };
              int pid = emu_spawn("/bin/busybox", av, ev, &fd);
              if (pid < 0) {
                  fprintf(stderr, "FAIL: emu_spawn: %s\n",
                      emu_last_error());
                  return 1;
              }
              printf("spawned pid=%d fd=%d\n", pid, fd);
              sleep(3);
              drain(fd, 2000);

              /* Test order note: all non-forking checks
               * go first; a single fork+exec check goes
               * last.  The emu's fork+exec child currently
               * blocks on teardown, so any command after
               * the first external applet stalls until the
               * next run() deadline fires.  Testing pipes,
               * external applets, stat/cat etc beyond that
               * would just accumulate timeouts. */

              printf("\n=== Builtins ===\n");
              out = run(fd, "echo hello", 2);
              chk("echo", out, "hello");
              out = run(fd, "pwd", 2);
              chk("pwd", out, "/");
              out = run(fd, "true; echo $?", 2);
              chk("true", out, "0");
              out = run(fd, "false; echo $?", 2);
              chk("false", out, "1");
              out = run(fd, "test 1 -eq 1; echo $?", 2);
              chk("test builtin", out, "0");
              out = run(fd, "test 1 -eq 2; echo $?", 2);
              chk("test builtin (false)", out, "1");

              printf("\n=== Variable expansion ===\n");
              out = run(fd, "echo PID:$$", 3);
              chk("shell alive", out, "PID:");
              out = run(fd, "echo \"$HOME\"", 3);
              chk("HOME var", out, "/root");
              out = run(fd, "X=42; echo V:$X", 3);
              chk("var assign", out, "V:42");

              printf("\n=== Shell redirects ===\n");
              out = run(fd,
                  "echo X > /dev/null; echo REDIR_OK", 3);
              chk("redirect /dev/null", out, "REDIR_OK");
              out = run(fd,
                  "echo filetest > /tmp/tf; echo WR:$?",
                  3);
              chk("file write", out, "WR:0");
              out = run(fd,
                  "test -e /tmp/tf && echo Y2 || echo N2", 3);
              chk("overlay stat", out, "Y2");
              out = run(fd,
                  "test -e /bin/busybox && echo Y || echo N",
                  3);
              chk("rootfs stat", out, "Y");

              printf("\n=== Fork+exec (single) ===\n");
              /* Must be the last test.  After a fork+exec
               * the emu shell is blocked on the child's
               * exit path and any further command only
               * gets echoed back, not executed. */
              out = run(fd, "/bin/echo FORKTEST", 5);
              chk("fork+exec echo", out, "FORKTEST");

              printf("\n=== Summary ===\n");
              printf("%d passed, %d failed\n", pass, fail);
              if (fail > 0) {
                  printf("SOME TESTS FAILED\n");
                  return 1;
              }
              printf("ALL TESTS PASSED\n");
              return 0;
          }
          TESTEOF

          cc -O2 -I emu/include \
            -o /tmp/integration_test /tmp/integration_test.c \
            -Lemu/build -lemu -lpthread -lutil

          # Sign with disable-library-validation so dlopen of
          # our ad-hoc signed AOT dylibs is allowed on SIP-
          # enabled macOS 26 runners.
          cat > /tmp/test.entitlements << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          ENTEOF
          codesign --force --sign - \
            --entitlements /tmp/test.entitlements \
            /tmp/integration_test

          # Run the test under a shell watchdog so a hang
          # (e.g. child applet stuck on an unimplemented
          # syscall) gets killed before the 15-min step
          # timeout and we still dump breadcrumbs.
          set +e
          /tmp/integration_test "$ROOTFS" "$OVERLAY" &
          TEST_PID=$!
          ( sleep 300; kill -TERM "$TEST_PID" 2>/dev/null; \
            sleep 3; kill -KILL "$TEST_PID" 2>/dev/null ) &
          WATCHDOG_PID=$!
          wait "$TEST_PID"
          RC=$?
          kill -TERM "$WATCHDOG_PID" 2>/dev/null
          wait "$WATCHDOG_PID" 2>/dev/null
          set -e

          echo "--- integration test rc=$RC ---"
          echo "--- breadcrumbs (last 200 lines) ---"
          tail -200 /tmp/emu_crumbs.log 2>/dev/null \
            || echo "(no breadcrumb log at /tmp/emu_crumbs.log)"
          exit $RC
