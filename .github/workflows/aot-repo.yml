name: Build AOT Repository

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package list (empty = base set)'
        required: false
        default: ''
  schedule:
    # Weekly rebuild to pick up Alpine security updates
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: aot-repo
  cancel-in-progress: true

jobs:
  build-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build AOT patcher
        run: cc -O2 -o scripts/.aot_patch scripts/aot_patch.c

      - name: Build AOT repository
        run: |
          PKGS="${{ github.event.inputs.packages }}"
          if [ -z "$PKGS" ]; then
            # Full desktop: uses auto dependency resolution
            ./scripts/build_aot_repo.sh v3.21 aarch64 repo/aarch64
          else
            ./scripts/build_aot_repo.sh v3.21 aarch64 repo/aarch64 $PKGS
          fi

      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: aot-repo
          path: repo/
          retention-days: 30

      - name: Create release archive
        if: github.ref == 'refs/heads/main'
        run: tar -czf aot-repo.tar.gz -C repo .

      - name: Upload release archive
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: aot-repo-archive
          path: aot-repo.tar.gz
          retention-days: 90
