name: Build AOT Repository

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package list (empty = all Alpine)'
        required: false
        default: ''
  schedule:
    # Daily: rebuild full repo, picks up new/updated packages
    - cron: '0 4 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: aot-repo
  cancel-in-progress: true

jobs:
  build-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Build AOT tools
        run: |
          cc -O2 -o scripts/.aot_patch scripts/aot_patch.c
          cc -O2 -o scripts/.elf2macho scripts/elf2macho.c

      - name: Restore previous repository from branch
        run: |
          mkdir -p repo/aarch64
          if git fetch origin aot-repo 2>/dev/null; then
            echo "Restoring from aot-repo branch..."
            git checkout origin/aot-repo -- aarch64/ 2>/dev/null && \
              mv aarch64/* repo/aarch64/ && rmdir aarch64 || true
            echo "Existing packages: $(ls repo/aarch64/*.apk 2>/dev/null | wc -l)"
          else
            echo "No existing repository found"
          fi

      - name: Build manifest of existing packages
        run: |
          ls repo/aarch64/*.apk 2>/dev/null | \
            xargs -I{} basename {} | \
            sed 's/-[0-9].*//' | sort -u > /tmp/done.txt
          echo "Already processed: $(wc -l < /tmp/done.txt) packages"

      - name: Build AOT repository
        run: |
          PKGS="${{ github.event.inputs.packages }}"

          if [ -n "$PKGS" ]; then
            ./scripts/build_aot_repo.sh v3.21 aarch64 repo/aarch64 $PKGS
          else
            # Get ALL package names from Alpine
            echo "Fetching full Alpine package index..."
            for r in main community; do
              curl -sL "http://dl-cdn.alpinelinux.org/alpine/v3.21/$r/aarch64/APKINDEX.tar.gz" | \
                tar -xzf - -O APKINDEX 2>/dev/null | \
                awk '/^P:/ { print substr($0, 3) }'
            done | sort -u > /tmp/all_pkgs.txt

            TOTAL=$(wc -l < /tmp/all_pkgs.txt)
            comm -23 /tmp/all_pkgs.txt /tmp/done.txt > /tmp/remaining.txt
            REMAINING=$(wc -l < /tmp/remaining.txt)
            echo "Total: $TOTAL, Done: $((TOTAL - REMAINING)), New: $REMAINING"

            if [ "$REMAINING" -eq 0 ]; then
              echo "Repository is up to date!"
              exit 0
            fi

            # Pass package list as a file (avoids arg-list-too-long)
            ./scripts/build_aot_repo.sh v3.21 aarch64 repo/aarch64 /tmp/remaining.txt
          fi

      - name: Repository stats
        run: |
          NAPK=$(ls repo/aarch64/*.apk 2>/dev/null | wc -l)
          SIZE=$(du -sh repo/ 2>/dev/null | cut -f1)
          echo "## AOT Repository: $NAPK packages, $SIZE" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove oversized packages
        run: |
          # GitHub rejects files > 100MB in git repos
          find repo/aarch64 -name '*.apk' -size +95M -exec rm -v {} \;

      - name: Publish to aot-repo branch
        run: |
          cd repo
          git init
          git checkout -b aot-repo
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -m "AOT repo update $(date -u +%Y-%m-%d): $(ls aarch64/*.apk | wc -l) packages"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aot-repo
