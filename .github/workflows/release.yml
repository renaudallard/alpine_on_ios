name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.6.26)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
            chmod +x rootfs/alpine/root/.xinitrc rootfs/alpine/root/start-firefox.sh 2>/dev/null || true
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          BUILD_DIR=$(xcodebuild -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO \
            | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')
          mkdir -p Payload
          ditto "$BUILD_DIR/AlpineOnIOS.app" Payload/AlpineOnIOS.app
          zip -ry "AlpineOnIOS-${{ steps.version.outputs.tag }}.ipa" Payload/
          rm -rf Payload

      - name: Build macOS app
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnMac \
            -configuration Release \
            CODE_SIGN_IDENTITY="-"

      - name: Package macOS DMG
        run: |
          BUILD_DIR=$(xcodebuild -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnMac \
            -configuration Release \
            -showBuildSettings \
            | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')
          DMG="AlpineOnMac-${{ steps.version.outputs.tag }}.dmg"
          STAGING=$(mktemp -d)
          cp -R "$BUILD_DIR/AlpineOnMac.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Alpine Terminal" \
            -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG"
          rm -rf "$STAGING"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Alpine on iOS ${{ steps.version.outputs.tag }}"
          body: |
            ## Alpine on iOS ${{ steps.version.outputs.tag }}

            AArch64 Linux emulator running Alpine Linux on iOS and macOS.

            ### iOS
            Download the `.ipa` and sideload with
            [AltStore](https://altstore.io/) or
            [Sideloadly](https://sideloadly.io/).

            ### macOS (Apple Silicon)
            Download the `.dmg`, open it, and drag Alpine Terminal to Applications.
          files: |
            AlpineOnIOS-${{ steps.version.outputs.tag }}.ipa
            AlpineOnMac-${{ steps.version.outputs.tag }}.dmg
          draft: false
          prerelease: false
