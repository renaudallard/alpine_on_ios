name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.6.26)'
        required: true

jobs:
  build:
    name: Build and release
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build AOT tools outside xcodebuild
        run: |
          mkdir -p /tmp/aot-tools
          cc -O2 -o /tmp/aot-tools/elf2macho scripts/elf2macho.c
          codesign --force --sign - /tmp/aot-tools/elf2macho 2>&1 || true
          echo "ELF2MACHO_PREBUILT=/tmp/aot-tools/elf2macho" >> "$GITHUB_ENV"

      - name: Download rootfs
        run: ./rootfs/download_rootfs.sh

      - name: Apply rootfs overlay
        run: |
          if [ -d rootfs/overlay ]; then
            cp -r rootfs/overlay/* rootfs/alpine/
            chmod +x rootfs/alpine/root/.xinitrc rootfs/alpine/root/start-firefox.sh 2>/dev/null || true
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild build \
            -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA
        run: |
          BUILD_DIR=$(xcodebuild -project AlpineOnIOS.xcodeproj \
            -scheme AlpineOnIOS \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings CODE_SIGNING_ALLOWED=NO \
            | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')
          mkdir -p Payload
          ditto "$BUILD_DIR/AlpineOnIOS.app" Payload/AlpineOnIOS.app
          zip -ry "AlpineOnIOS-${{ steps.version.outputs.tag }}.ipa" Payload/
          rm -rf Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Alpine on iOS ${{ steps.version.outputs.tag }}"
          body: |
            ## Alpine on iOS ${{ steps.version.outputs.tag }}

            AArch64 Linux emulator running Alpine Linux on iOS.

            Download the `.ipa` and sideload with
            [AltStore](https://altstore.io/) or
            [Sideloadly](https://sideloadly.io/).
          files: |
            AlpineOnIOS-${{ steps.version.outputs.tag }}.ipa
          draft: false
          prerelease: false
