name: AlpineOnIOS
options:
  bundleIdPrefix: com.alpineonios
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    HEADER_SEARCH_PATHS: $(SRCROOT)/emu/include
    SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/AlpineOnIOS/Bridge/AlpineOnIOS-Bridging-Header.h

targets:
  AlpineOnIOS:
    type: application
    platform: iOS
    sources:
      - path: AlpineOnIOS
        excludes:
          - "**/*.plist"
      - path: emu/src
        compilerFlags: ["-std=c11", "-Wall", "-Wextra"]
        type: sources
        excludes:
          - "**/*.S"
      - path: emu/src/native_entry.S
        type: sources
      - path: emu/include
        type: headers
        headerVisibility: project
    info:
      path: AlpineOnIOS/App/Info.plist
    entitlements:
      path: AlpineOnIOS.entitlements
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    postBuildScripts:
      - script: |
          ROOTFS="${SRCROOT}/rootfs/alpine"
          DEST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/alpine"
          if [ -d "$ROOTFS" ]; then
            echo "Copying rootfs (no symlinks)..."
            rm -rf "$DEST"
            rsync -a --no-links "$ROOTFS/" "$DEST/"
            echo "AOT-patching ELF binaries..."
            # Xcode's build-phase script sandbox on macOS 26
            # SIGKILLs freshly-compiled cc binaries.  Accept a
            # pre-built elf2macho from either $ELF2MACHO_PREBUILT
            # (CI env var) or the fixed path the scheme preAction
            # writes to.
            if [ -z "$ELF2MACHO_PREBUILT" ] && \
               [ -x /tmp/aot_tools/elf2macho ]; then
              export ELF2MACHO_PREBUILT=/tmp/aot_tools/elf2macho
            fi
            export ELF2MACHO_PREBUILT
            "${SRCROOT}/scripts/patch_rootfs_aot.sh" "$DEST" "$ROOTFS"
            echo "Rootfs: $(du -sh "$DEST" | cut -f1)"
          else
            echo "warning: rootfs not found at $ROOTFS"
          fi
        name: Copy Alpine rootfs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpineonios.app
        MARKETING_VERSION: "0.6.101"
        CURRENT_PROJECT_VERSION: 83
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: "Alpine Terminal"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        ENABLE_HARDENED_RUNTIME: "NO"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "_GNU_SOURCE=1"

# Scheme pre-actions run OUTSIDE of xcodebuild's build-phase
# script sandbox and are therefore allowed to compile a fresh
# binary and run it later.  We use them to build elf2macho to a
# fixed path that the post-build script picks up via
# ELF2MACHO_PREBUILT.  This makes a plain "Build" in Xcode.app
# work the same as the CI pre-build step.
schemes:
  AlpineOnIOS:
    build:
      targets:
        AlpineOnIOS: all
      preActions:
        - script: |
            set -e
            mkdir -p /tmp/aot_tools
            # Scheme pre-actions inherit every *_DEPLOYMENT_TARGET
            # env var from the scheme's target, which confuses
            # clang into thinking we want a multi-platform host
            # build.  Force a clean macOS host target instead.
            env -i PATH="$PATH" HOME="$HOME" SRCROOT="$SRCROOT" \
                xcrun clang -target arm64-apple-macos13 -O2 \
                -o /tmp/aot_tools/elf2macho \
                "${SRCROOT}/scripts/elf2macho.c"
            /usr/bin/codesign --force --sign - \
                /tmp/aot_tools/elf2macho 2>/dev/null || true
          name: Build elf2macho outside sandbox
          settingsTarget: AlpineOnIOS
